<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Daily Accounts | Chendrayudu Online Services</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f4f8;
    color:#222;
}

.login-container,
.accounts-container{
    width:100%;
    min-height:100vh;
}

/* LOGIN */

.login-container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.login-box h1{
    text-align:center;
    color:#002b7f;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input,
select{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#002b7f;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.error{
    color:red;
    text-align:center;
    margin-top:15px;
}


/* ACCOUNTS */

.accounts-container{
    display:none;
}

header{
    background:#002b7f;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:28px;
}

.logout-btn{
    width:auto;
    background:#d40000;
    padding:10px 20px;
    margin-top:15px;
}


/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.summary-card{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.summary-card h3{
    margin-bottom:10px;
}

.income{
    color:green;
}

.expense{
    color:red;
}

.profit{
    color:#002b7f;
}


/* FORM */

.form-container{
    max-width:700px;
    margin:20px auto;
    padding:20px;
}

.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.form-box h2{
    text-align:center;
    color:#002b7f;
    margin-bottom:20px;
}


/* TABLE */

.records-container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.records-container h2{
    color:#002b7f;
    margin-bottom:20px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#002b7f;
    color:white;
}

th,
td{
    padding:14px;
    text-align:center;
    border:1px solid #ddd;
}

.delete-btn{
    background:red;
    width:auto;
    padding:8px 12px;
}

.no-data{
    text-align:center;
    padding:20px;
    color:#777;
}


/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:22px;
    }

    .summary{
        padding:15px;
    }

    .form-container,
    .records-container{
        padding:15px;
    }

}

</style>

</head>


<body>


<!-- LOGIN PAGE -->

<div class="login-container" id="loginContainer">

<div class="login-box">

<h1>🔐 Private Login</h1>

<p>Chendrayudu Online Services</p>

<input
type="email"
id="email"
placeholder="Enter Email"
>

<input
type="password"
id="password"
placeholder="Enter Password"
>

<button onclick="login()">
Login
</button>

<p class="error" id="errorMessage"></p>

</div>

</div>



<!-- ACCOUNTS PAGE -->

<div class="accounts-container" id="accountsContainer">

<header>

<h1>📊 Daily Accounts</h1>

<p>Chendrayudu Online Services</p>

<button
class="logout-btn"
onclick="logout()"
>
Logout
</button>

</header>



<!-- SUMMARY -->

<div class="summary">

<div class="summary-card">

<h3>Total Income</h3>

<h2 class="income">
₹ <span id="totalIncome">0</span>
</h2>

</div>


<div class="summary-card">

<h3>Total Expense</h3>

<h2 class="expense">
₹ <span id="totalExpense">0</span>
</h2>

</div>


<div class="summary-card">

<h3>Profit / Loss</h3>

<h2 class="profit">
₹ <span id="totalProfit">0</span>
</h2>

</div>

</div>



<!-- ADD RECORD -->

<div class="form-container">

<div class="form-box">

<h2>Add Daily Record</h2>


<select id="service">

<option value="">Select Service</option>

<option>PAN Card</option>

<option>Aadhaar Services</option>

<option>Udyam Certificate</option>

<option>Bill Payments</option>

<option>Driving Licence</option>

<option>Voter ID</option>

<option>Passport</option>

<option>E-Shram Card</option>

<option>Ration Card</option>

<option>Train Tickets</option>

<option>APPSC</option>

<option>UPSC</option>

<option>SSC</option>

<option>Railway Jobs</option>

<option>E-Challan</option>

<option>CAP Services</option>

<option>PDF Tools</option>

<option>AP Seva</option>

<option>Sejda PDF Editor</option>

<option>Crop Tool</option>

<option>EPFO Services</option>

<option>Other Service</option>

</select>


<input
type="number"
id="income"
placeholder="Customer Amount (Income ₹)"
>


<input
type="number"
id="expense"
placeholder="Your Expense ₹"
>


<input
type="text"
id="description"
placeholder="Description (Optional)"
>


<button onclick="addRecord()">

➕ Add Record

</button>

</div>

</div>



<!-- RECORDS -->

<div class="records-container">

<h2>📋 Daily Records</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Date</th>

<th>Service</th>

<th>Income</th>

<th>Expense</th>

<th>Profit</th>

<th>Description</th>

<th>Action</th>

</tr>

</thead>

<tbody id="recordsTable">

</tbody>

</table>

</div>

</div>


</div>



<script type="module">

/* FIREBASE IMPORTS */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
query,
orderBy
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyB_AUh6P-Xa2JFhLeNtgQ3Ibk-kd0OwSvc",

authDomain:
"chendrayudu-online-services.firebaseapp.com",

projectId:
"chendrayudu-online-services",

storageBucket:
"chendrayudu-online-services.firebasestorage.app",

messagingSenderId:
"619882558498",

appId:
"1:619882558498:web:5da004bc90f27b211e067b",

measurementId:
"G-HXPJ015KJ0"

};



/* INITIALIZE */

const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



/* LOGIN */

window.login =
async function(){

const email =
document.getElementById("email").value;


const password =
document.getElementById("password").value;


const errorMessage =
document.getElementById("errorMessage");


errorMessage.innerText =
"";


if(!email || !password){

errorMessage.innerText =
"Please enter email and password";

return;

}


try{

await signInWithEmailAndPassword(

auth,

email,

password

);

}

catch(error){

errorMessage.innerText =
"Invalid email or password";

}

};



/* LOGOUT */

window.logout =
async function(){

await signOut(auth);

};



/* AUTH CHECK */

onAuthStateChanged(

auth,

(user)=>{

if(user){

document
.getElementById("loginContainer")
.style.display =
"none";


document
.getElementById("accountsContainer")
.style.display =
"block";


loadRecords();

}

else{

document
.getElementById("loginContainer")
.style.display =
"flex";


document
.getElementById("accountsContainer")
.style.display =
"none";

}

}

);



/* ADD RECORD */

window.addRecord =
async function(){


const service =
document.getElementById("service").value;


const income =
Number(
document.getElementById("income").value
);


const expense =
Number(
document.getElementById("expense").value
);


const description =
document.getElementById("description").value;


if(!service){

alert(
"Please select a service"
);

return;

}


if(
document.getElementById("income").value === ""
){

alert(
"Please enter income amount"
);

return;

}


const profit =
income - expense;


const today =
new Date()
.toLocaleDateString(
"en-IN"
);


try{

await addDoc(

collection(
db,
"accounts"
),

{

service:service,

income:income,

expense:expense,

profit:profit,

description:description,

date:today,

createdAt:
Date.now()

}

);


alert(
"Record Added Successfully ✅"
);


/* CLEAR FORM */

document
.getElementById("service")
.value =
"";


document
.getElementById("income")
.value =
"";


document
.getElementById("expense")
.value =
"";


document
.getElementById("description")
.value =
"";


loadRecords();

}

catch(error){

alert(
"Error saving record: "
+
error.message
);

}

};



/* LOAD RECORDS */

async function loadRecords(){


const recordsTable =
document.getElementById(
"recordsTable"
);


recordsTable.innerHTML =
"";


let totalIncome =
0;


let totalExpense =
0;


let totalProfit =
0;


try{


const q =
query(

collection(
db,
"accounts"
),

orderBy(
"createdAt",
"desc"
)

);


const querySnapshot =
await getDocs(q);



querySnapshot.forEach(

(documentSnapshot)=>{


const data =
documentSnapshot.data();


totalIncome +=
data.income || 0;


totalExpense +=
data.expense || 0;


totalProfit +=
data.profit || 0;



const row =
document.createElement(
"tr"
);



row.innerHTML =

`

<td>${data.date}</td>

<td>${data.service}</td>

<td>₹${data.income}</td>

<td>₹${data.expense}</td>

<td>₹${data.profit}</td>

<td>${data.description || ""}</td>

<td>

<button
class="delete-btn"
onclick="deleteRecord('${documentSnapshot.id}')"
>

Delete

</button>

</td>

`;


recordsTable.appendChild(
row
);


}

);



document
.getElementById("totalIncome")
.innerText =
totalIncome;


document
.getElementById("totalExpense")
.innerText =
totalExpense;


document
.getElementById("totalProfit")
.innerText =
totalProfit;


}

catch(error){

console.error(error);

alert(
"Unable to load records: "
+
error.message
);

}

}



/* DELETE RECORD */

window.deleteRecord =
async function(id){


const confirmDelete =
confirm(
"Delete this record?"
);


if(!confirmDelete){

return;

}


try{


await deleteDoc(

doc(
db,
"accounts",
id
)

);


loadRecords();


}

catch(error){

alert(
"Error deleting record"
);

}

};


</script>

</body>

</html>
